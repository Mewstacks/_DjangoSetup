name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_USE_EXTERNAL_SERVICES: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install uv==0.12.0 && uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py spectacular --file /tmp/openapi-schema.yml --validate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Production configuration check
        run: uv run python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: deploy-check-only-please-use-a-generated-value-000000000000000000000000
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          DATABASE_URL: postgresql://user:pass@localhost:5432/app
          REDIS_URL: redis://localhost:6379/0
          SENTRY_DSN: https://public@example.com/1
          FIELD_ENCRYPTION_ACTIVE_KEY_ID: v1
          FIELD_ENCRYPTION_KEYS: '{"v1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
          PRIVACY_HMAC_KEY: test-privacy-hmac-key-at-least-32-bytes
      - name: Tests
        run: uv run pytest --cov --cov-report=xml
      - name: Dependency audit
        run: uv run pip-audit
      - name: Production image
        run: docker build --tag saas-backend:test .
