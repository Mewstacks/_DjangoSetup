name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same gate before it publishes anything.
  workflow_call:
  # A new advisory against an unchanged lockfile is found on Monday, not at the next push.
  schedule:
    - cron: "17 5 * * 1"

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: saas
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: ci-only-password  # zizmor: ignore[hardcoded-container-credentials] throwaway CI database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas -d saas" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No source file is hidden from git
        # An unanchored .gitignore rule once kept src/apps/uploads out of the repository; the app
        # imported fine locally and a clean clone could not boot. Runs before anything is built.
        run: |
          hidden="$(git status --ignored --porcelain -- src | grep '^!!' | grep -v '__pycache__' || true)"
          if [ -n "$hidden" ]; then echo "Ignored files under src/:"; echo "$hidden"; exit 1; fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
      - name: Install
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv sync --locked --all-extras --python "$PYTHON_VERSION"
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          # The first lines are a header that names the output path; compare the pins only.
          diff -u <(tail -n +3 requirements.txt) <(tail -n +3 "$RUNNER_TEMP/requirements.txt")
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Tests (sqlite)
        run: uv run pytest --cov --cov-report=term-missing
      - name: Tests (postgres + redis)
        env:
          TEST_USE_EXTERNAL_SERVICES: "true"
          DB_ENGINE: postgresql
          DB_HOST: 127.0.0.1
          DB_NAME: saas
          DB_USER: saas
          DB_PASSWORD: ci-only-password
          REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run pytest -q
      - name: Migrations, action catalog and OpenAPI are in sync
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py actions_catalog --check
          uv run python scripts/check_openapi.py
          uv run python scripts/gen_docs.py --check
      - name: Production settings pass the deploy check
        run: uv run python scripts/verify.py --deploy-check-only
      - name: Deployment manifests render
        env:
          APP_IMAGE: ghcr.io/example/app:ci
          DB_PASSWORD: ci-only-not-a-secret
          APP_DB_USER: app_runtime
          APP_DB_PASSWORD: ci-only-not-a-secret
          REDIS_PASSWORD: ci-only-not-a-secret
        run: |
          docker compose -f deploy/compose/compose.prod.yaml --env-file deploy/compose/prod.env.example config --quiet
          kubectl kustomize deploy/k8s/overlays/production > /dev/null

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # gitleaks scans history
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
      - run: uv sync --locked --all-extras
      - name: Known vulnerabilities in locked dependencies
        # Audits what uv.lock says, not a requirements.txt that may have gone stale after a bump.
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      - name: Static security analysis
        run: uv run bandit -r src -q -ll
      - name: Secrets in the repository history
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
      - name: Workflow security
        run: uvx zizmor==1.31.1 --pedantic .github/workflows
      - name: Deployment manifests (misconfiguration scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Dockerfile lint
        run: docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold warning - < Dockerfile
      - name: SBOM
        run: uv run cyclonedx-py environment --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image boots a role
        run: docker run --rm -e DJANGO_SETTINGS_MODULE=config.settings.test app:ci manage check
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
      - name: The image boots with production settings
        # The validators refuse weak or missing configuration, so this proves the shipped image
        # and the documented minimum variables agree (the values are throwaway, never deployed).
        run: |
          python3 scripts/verify.py --print-deploy-env > "$RUNNER_TEMP/deploy.env"
          docker run --rm --env-file "$RUNNER_TEMP/deploy.env" app:ci manage check --deploy --fail-level WARNING
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
