components:
  schemas:
    ActionCatalog:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
        total:
          type: integer
      required:
      - items
      - total
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        kind:
          enum:
          - api
          - agent
          type: string
          description: |-
            * `api` - API
            * `agent` - AI agent
          x-spec-enum-id: e7bca48724c70425
          readOnly: true
        public_id:
          type: string
          readOnly: true
        scopes:
          readOnly: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        allowed_ips:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - allowed_ips
      - created_at
      - expires_at
      - id
      - kind
      - label
      - last_used_at
      - public_id
      - revoked_at
      - scopes
    ApiKeyCreate:
      type: object
      properties:
        label:
          type: string
          maxLength: 120
        kind:
          enum:
          - api
          - agent
          type: string
          description: |-
            * `api` - API
            * `agent` - AI agent
          x-spec-enum-id: e7bca48724c70425
          default: api
        profile:
          enum:
          - read
          - full
          type: string
          description: |-
            * `read` - read
            * `full` - full
          x-spec-enum-id: 21373e88867f49c0
        scopes:
          type: array
          items:
            type: string
        expires_in_days:
          type: integer
          maximum: 365
          minimum: 1
        allowed_ips:
          type: array
          items:
            type: string
      required:
      - label
    ApiKeySecret:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        kind:
          enum:
          - api
          - agent
          type: string
          description: |-
            * `api` - API
            * `agent` - AI agent
          x-spec-enum-id: e7bca48724c70425
          readOnly: true
        public_id:
          type: string
          readOnly: true
        scopes:
          readOnly: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        allowed_ips:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        secret:
          type: string
          readOnly: true
      required:
      - allowed_ips
      - created_at
      - expires_at
      - id
      - kind
      - label
      - last_used_at
      - public_id
      - revoked_at
      - scopes
      - secret
    Consent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        idempotency_key:
          type: string
          format: uuid
          writeOnly: true
        guardian_confirmed:
          type: boolean
          writeOnly: true
          default: false
        purpose:
          type: string
          format: uuid
        notice:
          type: string
          format: uuid
        decision:
          enum:
          - granted
          - withdrawn
          type: string
          description: |-
            * `granted` - Granted
            * `withdrawn` - Withdrawn
          x-spec-enum-id: e708fbd556fb973d
        recorded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - decision
      - id
      - notice
      - purpose
      - recorded_at
    ConsentState:
      type: object
      properties:
        purpose:
          type: string
        name:
          type: string
        decision:
