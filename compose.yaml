name: saas-backend

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-saas}
      POSTGRES_USER: ${DB_USER:-saas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-postgres-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-saas} -d ${DB_NAME:-saas}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      # Preserve the image's virtualenv; the bind mount above would otherwise hide it and
      # the host has no matching .venv, leaving python unresolved in the container.
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --profile temporal: the dev server (SQLite, one container) plus the worker.
  # Set TEMPORAL_ENABLED=true in .env. For production use the multi-service stack in
  # deploy/compose (temporalio/server + admin-tools + ui) or the Helm chart.
  temporal:
    profiles: ["temporal"]
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"   # Web UI
    volumes:
      - temporal-data:/data
    restart: unless-stopped

  worker:
    profiles: ["temporal"]
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ENABLED: "true"
      TEMPORAL_ADDRESS: temporal:7233
    command: ["python", "manage.py", "flows_worker"]
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started

  # --profile observability: Grafana + Tempo + Loki + Prometheus in one container (dev only).
  # Set OTEL_ENABLED=true and OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 in .env, then
  # open http://localhost:3000 (admin / admin).
  lgtm:
    profiles: ["observability"]
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  lgtm-data:
  redis-data:
  temporal-data:
