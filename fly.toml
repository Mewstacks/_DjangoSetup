# Change this with: python scripts/configure_fly.py your-unique-app-name
app = "replace-with-your-app-name"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python manage.py migrate --noinput"
  release_command_timeout = "10m"
  strategy = "rolling"

[env]
  ADMIN_ENABLED = "false"
  API_DOCS_ENABLED = "false"
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  DB_SSL_REQUIRE = "true"
  LOG_LEVEL = "INFO"
  OBJECT_STORAGE_REQUIRED = "true"
  PORT = "8000"
  PRIMARY_REGION = "gru"
  SENTRY_ENABLED = "true"
  SENTRY_ENVIRONMENT = "production"
  SENTRY_TRACES_SAMPLE_RATE = "0.05"

[processes]
  web = "gunicorn config.asgi:application --bind 0.0.0.0:8000 --worker-class uvicorn_worker.UvicornWorker --workers 2 --timeout 30 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile -"
  worker = "celery -A config worker --loglevel=INFO --concurrency=1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v1/health/ready/"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
