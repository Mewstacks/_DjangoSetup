# Temporal worker. Scale to 0 (or delete) when TEMPORAL_ENABLED is false.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/component: worker, app.kubernetes.io/name: app}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: app
          args: ["worker"]
          env:
            - {name: CONTAINER_ROLE, value: worker}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
