# NOT in kustomization.yaml. Create it with your secret manager / sealed-secrets / external-secrets.
# Values come from: python scripts/generate_production_secrets.py
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: ""
  FIELD_ENCRYPTION_ACTIVE_KEY_ID: v1
  FIELD_ENCRYPTION_KEYS: ""
  PRIVACY_HMAC_KEY: ""
  AUDIT_HMAC_KEY: ""
  # The runtime role: reads and writes rows, owns nothing (see docs/en/security/hardening.md).
  DB_USER: app_runtime
  DB_PASSWORD: ""
  REDIS_URL: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  # SENTRY_DSN: ""   # only when SENTRY_ENABLED is true
---
# Used only by the migrate Job: the owner of the schema. Never mounted on web, worker or scheduler.
apiVersion: v1
kind: Secret
metadata:
  name: app-migrator
type: Opaque
stringData:
  DB_USER: app
  DB_PASSWORD: ""
