apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
labels:
  - pairs:
      app.kubernetes.io/name: app
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - web.yaml
  - worker.yaml
  - scheduler.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - cronjob-backup.yaml
images:
  - name: app
    newName: ghcr.io/you/app
    newTag: latest
# Secrets are not part of the base: create `app-secrets` out of band (see secret.example.yaml)
# and run the migrate Job (migrate-job.yaml) before rolling out a new image.
