# Nightly logical backup to a PVC named `app-backups`. The dump holds every tenant's data in the
# clear: back the PVC with an encrypted StorageClass and ship copies off-cluster encrypted
# (restic, pgBackRest, or your cloud's snapshot encryption).
# Restore: pg_restore --clean --if-exists --no-owner -d "$DB" file.dump
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: pg-dump
              image: postgres:17-bookworm
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  umask 077
                  f=/backups/$(date -u +%Y%m%dT%H%M%SZ).dump
                  pg_dump --format=custom --no-owner --file="$f"
                  find /backups -name '*.dump' -mtime +14 -delete
                  echo "backup ok: $f"
              env:
                - {name: PGHOST, valueFrom: {configMapKeyRef: {name: app-config, key: DB_HOST}}}
                - {name: PGDATABASE, valueFrom: {configMapKeyRef: {name: app-config, key: DB_NAME}}}
                - {name: PGUSER, valueFrom: {secretKeyRef: {name: app-secrets, key: DB_USER}}}
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: DB_PASSWORD}}}
                - {name: PGSSLMODE, value: verify-full}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backups, mountPath: /backups}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: app-backups}
            - name: tmp
              emptyDir: {}
