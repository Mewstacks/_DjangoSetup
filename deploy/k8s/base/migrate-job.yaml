# Apply before rolling out a new image:
#   kubectl -n app delete job migrate --ignore-not-found && kubectl apply -f migrate-job.yaml
#   kubectl -n app wait --for=condition=complete job/migrate --timeout=600s
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: app
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/component: migrate, app.kubernetes.io/name: app}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/you/app:latest
          args: ["migrate"]
          env:
            - {name: CONTAINER_ROLE, value: migrate}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
