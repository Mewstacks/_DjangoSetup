apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/component: web}
  template:
    metadata:
      labels: {app.kubernetes.io/component: web, app.kubernetes.io/name: app}
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: app
          args: ["web"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 768Mi}
          startupProbe:
            httpGet: {path: /api/v1/health/live/, port: http}
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: /api/v1/health/live/, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /api/v1/health/ready/, port: http}
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app.kubernetes.io/component: web}
  ports:
    - {name: http, port: 80, targetPort: http}
