apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DJANGO_ALLOWED_HOSTS: app.example.com
  PUBLIC_URL: https://app.example.com
  DJANGO_CSRF_TRUSTED_ORIGINS: https://app.example.com
  DJANGO_CORS_ALLOWED_ORIGINS: https://app.example.com
  DB_ENGINE: postgresql
  DB_NAME: app
  DB_HOST: postgres.example.internal
  DB_PORT: "5432"
  TRUSTED_PROXY_COUNT: "1"
  OBJECT_STORAGE_REQUIRED: "true"
  S3_BUCKET: app-media
  # S3_ENDPOINT_URL / S3_REGION for non-AWS stores
  SENTRY_ENABLED: "false"
  EMAIL_HOST: smtp.example.internal
  EMAIL_PORT: "587"
  DEFAULT_FROM_EMAIL: no-reply@app.example.com
  PRIVACY_CONTROLLER_NAME: Example Ltda
  DPO_NAME: Example DPO
  DPO_EMAIL: dpo@example.com
  TEMPORAL_ENABLED: "false"
  LOG_LEVEL: INFO
